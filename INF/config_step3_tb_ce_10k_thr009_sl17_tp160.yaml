# Step 3: TB + CrossEntropy + class_balance weighted
#         train=10k, threshold=0.09, SL=17, TP=160, trailing=0
config_name: eth_1h_tb_ce_10k_thr009_sl17_tp160

data:
  csv_path: CNN\data\raw\ETHUSDT-1h-data.csv
  pair: ETHUSDT
  timeframe: 1h
  recent_rows: 17280

preprocess:
  seq_len: 48

features:
  list:
    - body_over_open
    - high_minus_open_over_open
    - high_minus_close_over_close
    - low_minus_open_over_open
    - low_minus_close_over_close
    - range_over_open
    - range_over_close
    - volume
    - ATR_14

target:
  type: triple_barrier
  tp_pct: 0.012
  sl_pct: 0.012
  horizon: 12

walkforward:
  train_size: 10000
  val_size: 700
  step_size: 700
  max_windows: null
  anchor: 0
  min_train_rows: null
  test_size: 700

training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.001
  seed: 0
  device: auto
  loss: cross_entropy
  class_balance: weighted
  checkpoint_metric: val_equity
  top_k: 3
  checkpoint_min_equity: 0.0
  early_stopping:
    enabled: false
    patience: 10
    min_delta: 0.0

model:
  architectures: [conv1d, lstm, hybrid]
  output_dim: 3
  warm_start_checkpoint: null

backtest:
  taker_fee: 0.00055
  position_notional: 1000.0
  signal_threshold: 0.09
  sl_points: [17]
  tp_points: [160]
  trailing_stop_points: [0]
  sl_tp_grid: null
  grid_select_metric: sharpe

outputs:
  output_dir: INF/outputs

