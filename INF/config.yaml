# Única fonte de verdade para uma corrida de walk-forward (sem lógica em Python aqui).
# Paths relativos resolvem-se à raiz do repositório (pasta NN/) salvo indicação contrária no loader.
config_name: eth_1h_baseline

# Opcional: para batch interno no mesmo ficheiro, use `experiments`.
# Em modo single-config, deixe sem `experiments` e o pipeline mantém compatibilidade.
# experiments:
#   - name: base
#   - name: alt_epochs
#     training:
#       epochs: 50

data:
  csv_path: CNN\data\raw\ETHUSDT-1h-data.csv
  pair: ETHUSDT
  timeframe: 1h
  recent_rows: 17280

preprocess:
  seq_len: 48

features:
  list:
    - body_over_open
    - high_minus_open_over_open
    - high_minus_close_over_close
    - low_minus_open_over_open
    - low_minus_close_over_close
    - range_over_open
    - range_over_close
    - volume
    - ATR_14

target:
  type: triple_barrier
  tp_pct: 0.015
  sl_pct: 0.010
  horizon: 8

walkforward:
  train_size: 5000
  val_size: 700
  step_size: 700
  max_windows: null
  anchor: 0
  min_train_rows: null
  test_size: 700

training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.001
  seed: 0
  device: auto
  loss: cross_entropy
  class_balance: weighted
  checkpoint_metric: val_equity   # val_equity (CNN-aligned) | val_loss
  top_k: 3                         # apenas K melhores pesos ficam em disco
  checkpoint_min_equity: 1000.0    # só grava se val_equity > este valor
  early_stopping:
    enabled: false
    patience: 10
    min_delta: 0.0

model:
  architectures: [conv1d, lstm]
  output_dim: 3
  warm_start_checkpoint: null

backtest:
  taker_fee: 0.00055
  position_notional: 1000.0
  signal_threshold: 0.007
  sl_points: [4]
  tp_points: [75]
  trailing_stop_points: [10]
  sl_tp_grid: null
  grid_select_metric: final_equity

outputs:
  output_dir: INF/outputs

experiments:
  - name: feat_baseline_8
    features:
      list:
        - body_over_open
        - high_minus_open_over_open
        - high_minus_close_over_close
        - low_minus_open_over_open
        - low_minus_close_over_close
        - range_over_open
        - range_over_close
        - volume
  - name: feat_compact_5
    features:
      list:
        - body_over_open
        - high_minus_open_over_open
        - low_minus_open_over_open
        - range_over_open
        - volume
  - name: feat_min_3
    features:
      list:
        - body_over_open
        - range_over_open
        - volume
