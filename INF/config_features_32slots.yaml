features:
  # baseline features (slot 1). Experiments fazem override disto.
  list:
    - body_over_open
    - high_minus_open_over_open
    - high_minus_close_over_close
    - low_minus_open_over_open
    - low_minus_close_over_close
    - range_over_open
    - range_over_close
    - volume

walkforward:
