  val_size: 700
  step_size: 700
  max_windows: null
  anchor: 0
  min_train_rows: null
  test_size: 700

training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.001
  seed: 0
  device: auto
  checkpoint_metric: val_equity
  top_k: 3
  checkpoint_min_equity: 1000.0
  early_stopping:
    enabled: false
    patience: 10
    min_delta: 0.0
  class_balance:
    enabled: false
    method: undersample
    target_channel: 0
    threshold: auto
    neutral_policy: keep
    max_neutral_ratio: 1.0

model:
  architectures: [conv1d, lstm, hybrid]
  warm_start_checkpoint: null

