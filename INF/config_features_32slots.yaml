# Feature experiments plan (32 slots no plano).
# RESUME: primeira entrada em `experiments` = feat_plus_roi2_7 (slot 8).
#   Já corridos antes da interrupção: feat_bridge_4, feat_plus_rsi14,
#   feat_plus_rsi1_14, feat_plus_roi7 (ver run_20260427_183353 em outputs).
#
# Este ficheiro é separado do `INF/config.yaml` para não mexer no baseline.
#
# Slots 1–3 JÁ CORRIDOS (não repetir aqui):
#   run_id: run_20260427_150441  →  INF/outputs/runs_summary.csv
#   | slot | name             | avg_return | avg_drawdown |
#   |    1 | feat_baseline_8  | +2.37%     | 9.63%        |
#   |    2 | feat_compact_5   | −1.80%     | 12.41%       |
#   |    3 | feat_min_3       | −1.72%     | 10.81%       |
# Resolved dessa corrida: INF/outputs/run_20260427_150441/config.resolved.yaml
#
# Como usar:
# - aponta o runner para este ficheiro (em vez do `INF/config.yaml`)
# - ou copia só o bloco `experiments:` para o config que estiveres a correr
#
# Métrica de decisão: vence se melhorar >= 2 de 3:
#   1. final_equity médio across janelas → edge absoluto
#   2. % janelas com equity > 1000 → consistência
#   3. max_drawdown médio → risco
