# Step 2: triple_barrier + CrossEntropy + train=5k + class_balance weighted
#         Barreiras mais fáceis para sanidade:
#           tp_pct=0.012, sl_pct=0.012, horizon=12
config_name: eth_1h_tb_ce_5k_weighted_easybarriers

data:
  csv_path: CNN\data\raw\ETHUSDT-1h-data.csv
  pair: ETHUSDT
  timeframe: 1h
  recent_rows: 17280

preprocess:
  seq_len: 48

features:
  list:
    - body_over_open
    - high_minus_open_over_open
    - high_minus_close_over_close
    - low_minus_open_over_open
    - low_minus_close_over_close
    - range_over_open
    - range_over_close
    - volume
    - ATR_14

target:
  type: triple_barrier
  tp_pct: 0.012
  sl_pct: 0.012
  horizon: 12

walkforward:
  train_size: 5000
  val_size: 700
  step_size: 700
  max_windows: null
  anchor: 0
  min_train_rows: null
  test_size: 700

training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.001
  seed: 0
  device: auto
  loss: cross_entropy
  class_balance: weighted
  checkpoint_metric: val_equity
  top_k: 3
  # evitar falhar por não ultrapassar 1000.0 (especialmente durante tuning)
  checkpoint_min_equity: 0.0
  early_stopping:
    enabled: false
    patience: 10
    min_delta: 0.0

model:
  architectures: [conv1d, lstm, hybrid]
  output_dim: 3
  warm_start_checkpoint: null

backtest:
  taker_fee: 0.00055
  position_notional: 1000.0
  # Default (vai ser override nos experiments)
  signal_threshold: 0.20
  sl_points: [4]
  tp_points: [75]
  trailing_stop_points: [0]
  sl_tp_grid: null
  grid_select_metric: sharpe

outputs:
  output_dir: INF/outputs

experiments:
  - name: thr_0_20
    backtest:
      signal_threshold: 0.20
  - name: thr_0_25
    backtest:
      signal_threshold: 0.25

